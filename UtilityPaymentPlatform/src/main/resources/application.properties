spring.application.name=UtilityPaymentPlatform
# Spring does not read .env on its own. Run the app from this directory so the path resolves.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/utility_payments}
spring.datasource.username=${DB_USERNAME:utility}
spring.datasource.password=${DB_PASSWORD:utility}
# Flyway owns the schema (db/migration), Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
daraja.consumer-key=${DARAJA_CONSUMER_KEY}
daraja.consumer-secret=${DARAJA_CONSUMER_SECRET}
daraja.shortcode=${DARAJA_SHORTCODE}
daraja.passkey=${DARAJA_PASSKEY}
daraja.token-url=https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
daraja.stk-push-url=https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest
# Public HTTPS URL Safaricom posts results to, ending in /api/v1/callback/stk (ngrok in development)
daraja.callback-url=${DARAJA_CALLBACK_URL}
daraja.stk-query-url=https://sandbox.safaricom.co.ke/mpesa/stkpushquery/v1/query
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Raw M-Pesa callbacks, written by CallBackIngestPublisher, read by CallBackWorker
callback.stream-name=mpesa-callbacks
callback.consumer-group=callback-workers
callback.consumer-name=callback-worker-1
# A pending callback idle this long is reclaimed and retried, up to max-attempts deliveries
callback.reclaim-idle-ms=30000
callback.max-attempts=5
# Callbacks that failed max-attempts times or could not be parsed
callback.dead-letter-stream=mpesa-callbacks:dead

# OutboxPublisher polls PENDING rows and routes each one to a stream by event type
outbox.poll-interval-ms=1000
outbox.batch-size=50

# PAYMENT_CONFIRMED events from the outbox, read by TokenWorker
token.stream-name=payment-events
token.consumer-group=token-workers
token.consumer-name=token-worker-1
# A pending message idle this long is reclaimed and retried, up to max-attempts deliveries
token.reclaim-idle-ms=60000
token.max-attempts=5
# Payment events whose token could not be issued
token.dead-letter-stream=payment-events:token-dead

# PAYMENT_FAILED, TOKEN_ISSUED and TOKEN_ISSUANCE_FAILED events from the outbox, for NotificationWorker
notification.stream-name=notification-events

water.api.base-url=
electricity.api.base-url=

# ReconciliationJob asks Daraja about PENDING_CONFIRMATION transactions whose callback is overdue
reconciliation.interval-ms=60000
# how long to wait for the real callback before asking
reconciliation.pending-after-ms=120000
# still no answer after this long, flag the transaction for a person to check
reconciliation.give-up-after-ms=1800000

# DeadLetterMonitor logs an error when dead-letter streams or needs-review transactions grow
dead-letter-monitor.interval-ms=60000

# SlidingWindowRateLimiter used by InitiatePaymentUseCase, counted per phone number
rate-limit.payment.limit=3
rate-limit.payment.window-ms=60000
